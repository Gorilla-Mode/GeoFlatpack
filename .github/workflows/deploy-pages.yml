name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build application
        working-directory: web
        run: npm run build

      - name: Copy generated Skytefelt files
        run: |
          mkdir -p web/dist/test_data
          cp \
            test_data/Forurensning_0000_Norge_3035_Skytefelt_GML.SkyteOg_vingsfelt.fgb \
            test_data/Forurensning_0000_Norge_3035_Skytefelt_GML.Skytefeltgrense.fgb \
            test_data/Forurensning_0000_Norge_3035_Skytefelt_GML.gen.maplibre.json \
            web/dist/test_data/

      - name: Verify production assets
        shell: bash
        run: |
          shopt -s nullglob
          fgb_assets=(web/dist/assets/sample-obstacles-*.fgb)
          station_assets=(web/dist/assets/Samfunnssikkerhet_0000_Norge_25833_Brannstasjoner_GML-*.fgb)
          css_assets=(web/dist/assets/*.css)
          worker_assets=(web/dist/assets/maplibre-gl-worker-*.js)
          test "${#fgb_assets[@]}" -eq 1
          cmp test_data/sample-obstacles.fgb "${fgb_assets[0]}"
          test "${#station_assets[@]}" -eq 1
          cmp test_data/Samfunnssikkerhet_0000_Norge_25833_Brannstasjoner_GML.fgb "${station_assets[0]}"
          test "${#css_assets[@]}" -gt 0
          test "${#worker_assets[@]}" -gt 0
          for asset in "${css_assets[@]}" "${worker_assets[@]}"; do
            test -s "$asset"
          done

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
